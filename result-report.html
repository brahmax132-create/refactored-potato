<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Reports - Soheb Coaching</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <!-- Header with Back Button -->
        <div class="top-nav-bar">
            <a href="index.html" class="apple-back-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 18L9 12L15 6" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
        </div>

        <div class="page-title-container">
            <h1>Result Reports</h1>
        </div>

        <!-- Search Exam -->
        <div class="search-container">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 21L15 15M17 10C17 13.866 13.866 17 10 17C6.13401 17 3 13.866 3 10C3 6.13401 6.13401 3 10 3C13.866 3 17 6.13401 17 10Z" stroke="#86868b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input type="text" placeholder="Search exams by subject or date...">
        </div>

        <!-- Exam List Container -->
        <div class="records-list" style="padding-bottom: 30px;">
            
            <!-- Exam Item 1 -->
            <div class="student-card" onclick="window.location.href='exam-details.html?exam=math'">
                <div class="student-avatar" style="background: #e1f5fe; display: flex; align-items: center; justify-content: center; color: #0288d1; font-weight: bold;">
                    📊
                </div>
                <div class="student-info">
                    <h4>Mathematics Monthly Test</h4>
                    <p>Subject: Advanced Math</p>
                    <span class="join-date">📅 25 August 2026</span>
                </div>
                <div style="color: #86868b;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </div>
            </div>

            <!-- Exam Item 2 -->
            <div class="student-card" onclick="window.location.href='exam-details.html?exam=physics'">
                <div class="student-avatar" style="background: #e8f5e9; display: flex; align-items: center; justify-content: center; color: #388e3c; font-weight: bold;">
                    🔬
                </div>
                <div class="student-info">
                    <h4>Physics Mid-Term Exam</h4>
                    <p>Subject: Physics & Mechanics</p>
                    <span class="join-date">📅 15 August 2026</span>
                </div>
                <div style="color: #86868b;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </div>
            </div>

            <!-- Exam Item 3 -->
            <div class="student-card" onclick="window.location.href='exam-details.html?exam=chemistry'">
                <div class="student-avatar" style="background: #fff3e0; display: flex; align-items: center; justify-content: center; color: #f57c00; font-weight: bold;">
                    🧪
                </div>
                <div class="student-info">
                    <h4>Chemistry Weekly Quiz</h4>
                    <p>Subject: Organic Chemistry</p>
                    <span class="join-date">📅 05 August 2026</span>
                </div>
                <div style="color: #86868b;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </div>
            </div>

        </div>

        <!-- Bottom Navigation -->
        <div class="light-nav">
            <a href="home.html" class="nav-item active">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9 22V12H15V22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Home</span>
            </a>
            <a href="ai-chat.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 15C21 15.5304 20.7893 16.0391 20.4142 16.4142C20.0391 16.7893 19.5304 17 19 17H7L3 21V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H19C19.5304 3 20.0391 3.21071 20.4142 3.58579C20.7893 3.96086 21 4.46957 21 5V15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Aura AI</span>
            </a>
        </div>

    </div>

</body>
</html>
