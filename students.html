<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soheb Coaching - All Students</title>
    <style>
        body {
            background-color: #f5f5f7 !important;
            color: #1d1d1f !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        .app-container {
            background-color: #ffffff !important;
            color: #1d1d1f !important;
            min-height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            padding-bottom: 90px;
        }
        .app-view {
            padding: 16px;
        }
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-top: 10px;
        }
        .app-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1d1d1f;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #f5f5f7;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 1px solid rgba(0, 0, 0, 0.06);
            cursor: pointer;
        }
        .search-container {
            position: relative;
            margin-bottom: 20px;
        }
        .search-container input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background-color: #f5f5f7;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 14px;
            font-size: 15px;
            color: #1d1d1f;
            outline: none;
            box-sizing: border-box;
        }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #86868b;
        }
        .student-card {
            background-color: #fbfbfd;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
            cursor: pointer;
        }
        .student-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background-color: #e5e5ea;
        }
        .student-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .student-info h4 {
            font-size: 16px;
            font-weight: 600;
            color: #1d1d1f;
            margin: 0 0 3px 0;
        }
        .student-info p {
            font-size: 13px;
            color: #86868b;
            margin: 0 0 2px 0;
        }
        .join-date {
            font-size: 11px;
            color: #aeaeb2;
        }
        .light-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }
        .nav-item {
            color: #86868b;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            gap: 3px;
        }
        .nav-item.active {
            color: #0071e3;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="app-view">
            <div class="app-header">
                <a href="index.html" class="back-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </a>
                <h1>All Students</h1>
                <div style="width: 36px;"></div>
            </div>

            <div class="search-container">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="studentSearch" placeholder="Search students, class, roll no..." onkeyup="filterStudents()">
            </div>

            <div class="records-list" id="studentListContainer">
                <div class="student-card" onclick="openProfile('Aarav Sharma', '12th Grade', '21001', '15 May 2023', '123, Model Town, New Delhi', 'images/student1.jpg')">
                    <div class="student-avatar">
                        <img src="images/student1.jpg" alt="Aarav" onerror="this.src='https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150'">
                    </div>
                    <div class="student-info">
                        <h4>Aarav Sharma</h4>
                        <p>12th Grade &bull; Roll: 21001</p>
                        <span class="join-date">Joined: 15 May 2023</span>
                    </div>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#86868b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </div>

                <div class="student-card" onclick="openProfile('Fatima Khan', '11th Grade', '22015', '01 Jul 2023', '45, Civil Lines, Patna', 'images/student2.jpg')">
                    <div class="student-avatar">
                        <img src="images/student2.jpg" alt="Fatima" onerror="this.src='https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150'">
                    </div>
                    <div class="student-info">
                        <h4>Fatima Khan</h4>
                        <p>11th Grade &bull; Roll: 22015</p>
                        <span class="join-date">Joined: 01 Jul 2023</span>
                    </div>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#86868b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </div>
            </div>
        </div>

        <div class="light-nav">
            <a href="home.html" class="nav-item active">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Home
            </a>
            <a href="ai-chat.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                Aura AI
            </a>
        </div>
    </div>

    <script>
        function openProfile(name, grade, roll, joined, address, img) {
            let studentData = { name, grade, roll, joined, address, img };
            localStorage.setItem('selected_student', JSON.stringify(studentData));
            window.location.href = 'student-profile.html';
        }

        function filterStudents() {
            let input = document.getElementById('studentSearch').value.toLowerCase();
            let cards = document.getElementsByClassName('student-card');
            for (let i = 0; i < cards.length; i++) {
                let text = cards[i].innerText.toLowerCase();
                if (text.includes(input)) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
