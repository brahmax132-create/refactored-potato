<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soheb Coaching - Bill Statement</title>
    <style>
        body {
            background-color: #f5f5f7 !important;
            color: #1d1d1f !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        .app-container {
            background-color: #ffffff !important;
            color: #1d1d1f !important;
            min-height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            padding-bottom: 90px;
        }
        .app-view {
            padding: 16px;
        }
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-top: 10px;
        }
        .app-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1d1d1f;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #f5f5f7;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 1px solid rgba(0, 0, 0, 0.06);
            cursor: pointer;
        }
        .statement-box {
            background: #fbfbfd;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .tab-container {
            display: flex;
            background-color: #f0f0f2;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
        }
        .tab-btn {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #86868b;
            background: transparent;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background-color: #ffffff;
            color: #1d1d1f;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .light-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }
        .nav-item {
            color: #86868b;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            gap: 3px;
        }
        .nav-item.active {
            color: #0071e3;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="app-view">
            <div class="app-header">
                <a href="student-profile.html" class="back-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </a>
                <h1>Bill Statement</h1>
                <div style="width: 36px;"></div>
            </div>

            <div class="tab-container">
                <button class="tab-btn active" onclick="switchTab(event, 'bill-pending', 'bill-tab')">Pending Bills</button>
                <button class="tab-btn" onclick="switchTab(event, 'bill-confirmed', 'bill-tab')">Confirmed Bills</button>
            </div>

            <div id="bill-pending" class="tab-content bill-tab active">
                <div class="statement-box" style="border-left: 4px solid #ff9500;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <span style="font-weight: 600; color: #1d1d1f;">October 2026 Fee</span>
                        <span style="color: #ff9500; font-weight: 600;">₹2,500</span>
                    </div>
                    <p style="color: #86868b; font-size: 12px; margin: 0 0 10px 0;">Due Date: 10 Oct 2026</p>
                    <span style="font-size: 12px; color: #ff9500; background: #fff4e5; padding: 4px 10px; border-radius: 6px;">Status: Pending</span>
                </div>
            </div>

            <div id="bill-confirmed" class="tab-content bill-tab">
                <div class="statement-box" style="border-left: 4px solid #34c759;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <span style="font-weight: 600; color: #1d1d1f;">September 2026 Fee</span>
                        <span style="color: #34c759; font-weight: 600;">₹2,500</span>
                    </div>
                    <p style="color: #86868b; font-size: 12px; margin: 0 0 10px 0;">Paid on: 02 Sep 2026</p>
                    <span style="font-size: 12px; color: #34c759; background: #e4f2ea; padding: 4px 10px; border-radius: 6px;">Status: Confirmed / Paid</span>
                </div>
            </div>
        </div>

        <div class="light-nav">
            <a href="index.html" class="nav-item active">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Home
            </a>
            <a href="ai-chat.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                Aura AI
            </a>
        </div>
    </div>

    <script>
        function switchTab(evt, tabId, groupClassName) {
            let tabs = document.getElementsByClassName(groupClassName);
            for (let t of tabs) {
                t.classList.remove('active');
            }
            let buttons = evt.currentTarget.parentElement.getElementsByClassName('tab-btn');
            for (let b of buttons) {
                b.classList.remove('active');
            }
            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
